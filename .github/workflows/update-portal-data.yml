name: Actualizar datos del portal

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "manifest.json"
      - "portal/scripts/**"
      - ".github/workflows/update-portal-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-data-main
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar índice y calendario
        run: |
          mkdir -p portal-data
          node portal/scripts/generate-search-index.mjs . portal-data/search-index.json
          node portal/scripts/generate-calendar-events.mjs portal-data/search-index.json portal-data/calendar-events.json
          node portal/scripts/validate-portal-data.mjs portal-data/search-index.json portal-data/calendar-events.json

      - name: Publicar los datos regenerados
        run: |
          if git diff --quiet -- portal-data; then
            echo "Los datos del portal ya estaban actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-data
          git commit -m "Actualizar datos del portal"
          git push

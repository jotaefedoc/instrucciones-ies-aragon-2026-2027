name: Regenerar y publicar la guía

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/site/package-lock.json

      - name: Regenerar y validar los datos
        run: |
          mkdir -p portal-data
          node portal/scripts/generate-search-index.mjs . portal-data/search-index.json
          node portal/scripts/generate-calendar-events.mjs portal-data/search-index.json portal-data/calendar-events.json
          node portal/scripts/validate-portal-data.mjs portal-data/search-index.json portal-data/calendar-events.json

      - name: Preparar los datos de respaldo
        run: |
          mkdir -p portal/site/public
          cp portal-data/search-index.json portal/site/public/search-index.json
          cp portal-data/calendar-events.json portal/site/public/calendar-events.json
          touch portal/site/public/.nojekyll

      - name: Construir el portal estático
        working-directory: portal/site
        env:
          NEXT_PUBLIC_BASE_PATH: /instrucciones-ies-aragon-2026-2027
        run: |
          npm ci
          npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar la publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
